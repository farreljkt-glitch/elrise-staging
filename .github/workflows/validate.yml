name: Elrise validation

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://elrise_ci:unused@127.0.0.1:3306/elrise_ci
      AUTH_SECRET: ci-only-placeholder-secret-at-least-32-bytes-long
      PROXY_TRUST_SECRET: ci-only-proxy-shared-secret-at-least-32-bytes-long
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  mysql-schema-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: elrise_ci
          MYSQL_USER: elrise_ci
          MYSQL_PASSWORD: ci_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://elrise_ci:ci_password_only@127.0.0.1:3306/elrise_ci
      AUTH_SECRET: ci-only-placeholder-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Apply reviewed versioned migration to disposable MySQL
        run: npx prisma migrate deploy
      - name: Check database schema drift against Prisma after all migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Assert critical tables and unique constraints
        run: node integration/scripts/q6-schema-smoke.cjs
      - name: Exercise disposable MySQL transactions and unique keys
        run: node integration/scripts/q11-mysql-transactions.cjs
      - name: Boot isolated Next.js HTTP server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/elrise-q12-next.log 2>&1 &
          echo $! > /tmp/elrise-q12-next.pid
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/elrise-q12-next.log
          exit 1
      - name: Test real HTTP session and tenant isolation
        run: node integration/scripts/q12-http-isolation.cjs
      - name: Stop test server
        if: always()
        run: if test -f /tmp/elrise-q12-next.pid; then kill $(cat /tmp/elrise-q12-next.pid) || true; fi
