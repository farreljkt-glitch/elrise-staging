name: Elrise migration baseline proposal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://ci-only:ci-only@127.0.0.1:3306/elrise_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - name: Check versioned migration files exist
        run: |
          test -s prisma/migrations/20261013000000_initial_baseline/migration.sql
          test -s prisma/migrations/migration_lock.toml
          find prisma/migrations -name migration.sql -type f -print | sort
          echo "Schema drift is checked against migrated disposable MySQL in validate.yml"
