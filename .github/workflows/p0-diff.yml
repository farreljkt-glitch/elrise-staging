name: P0 tenant schema delta preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/elrise_ci
      - name: Generate Prisma delta from main
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/elrise-before.prisma
          npx prisma migrate diff --from-schema-datamodel /tmp/elrise-before.prisma --to-schema-datamodel prisma/schema.prisma --script > /tmp/p0-delta.sql
          echo "P0_DELTA_SQL_BEGIN"
          cat /tmp/p0-delta.sql
          echo "P0_DELTA_SQL_END"
